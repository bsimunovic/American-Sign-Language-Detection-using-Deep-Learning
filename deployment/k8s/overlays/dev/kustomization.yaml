# kubectl apply -k deployment/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: asl-dev
resources:
  - ../../base
images:
  - name: asl-api
    newName: asl-api
    newTag: dev
patches:
  - target:
      kind: Namespace
      name: asl
    patch: |-
      - op: replace
        path: /metadata/name
        value: asl-dev
  - target:
      kind: Deployment
      name: asl-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: asl-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: asl-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target:
      kind: Ingress
      name: asl-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: asl.dev.example.com
