apiVersion: apps/v1
kind: Deployment
metadata:
  name: asl-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asl-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asl-api
    spec:
      # Live sessions are WebSockets: give open streams time to finish on rollout.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: asl-api
      containers:
        - name: api
          # The image bakes in one model bundle, so the tag pins the model version.
          image: asl-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: asl-api
          env:
            # Read-only root filesystem: point library caches at the writable /tmp.
            - name: HOME
              value: /tmp
            - name: KERAS_HOME
              value: /tmp/.keras
            - name: MPLCONFIGDIR
              value: /tmp/.matplotlib
            # One process per pod; keep TensorFlow from oversubscribing the CPU limit.
            - name: TF_NUM_INTRAOP_THREADS
              value: "2"
            - name: TF_NUM_INTEROP_THREADS
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # TensorFlow + MediaPipe take a while to load and warm up.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the load balancer stop routing here before the process exits.
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
