apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asl-api
  annotations:
    # ingress-nginx proxies WebSockets natively; keep idle live sessions open
    # and allow image uploads up to the API's own limit.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
spec:
  ingressClassName: nginx
  rules:
    - host: asl.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asl-api
                port:
                  name: http
