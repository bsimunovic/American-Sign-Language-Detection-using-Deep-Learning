# kubectl apply -k deployment/k8s/overlays/prod
# Pin the image to an immutable tag (e.g. git SHA) so a rollout ships a known model.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: asl-api
    newName: registry.example.com/asl/asl-api
    newTag: "0.2.0"
configMapGenerator:
  - name: asl-api
    behavior: merge
    literals:
      - ASL_ENABLE_DEMO=false
      - ASL_LOG_LEVEL=warning
patches:
  - target:
      kind: Deployment
      name: asl-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: asl-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target:
      kind: Ingress
      name: asl-api
    patch: |-
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt
      - op: replace
        path: /spec/rules/0/host
        value: asl.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts: [asl.example.com]
            secretName: asl-api-tls
