[project]
name = "asl"
version = "0.2.0"
description = "American Sign Language alphabet and digit recognition: experiment lab and production API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<2.2",
    "tensorflow>=2.16,<2.21",
    # mp.solutions (the Hands API used here) was removed in later mediapipe releases.
    "mediapipe>=0.10.9,<0.10.15",
    # Headless OpenCV: no libGL/X11 needed, so the API image needs no system packages.
    # mediapipe's own GUI OpenCV requirement is dropped below so only one cv2 is installed.
    "opencv-contrib-python-headless>=4.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Production inference service (asl.prod.api).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
]
# Experiment pipeline (asl.lab).
lab = [
    "dvc>=3.50",
    "dvclive>=3.45",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
notebooks = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "httpx>=0.27",
    "websockets>=12",
]

[project.scripts]
asl-lab = "asl.lab.cli:main"
asl-api = "asl.prod.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asl"]

[tool.uv]
default-groups = ["dev"]
# mediapipe requires the GUI build "opencv-contrib-python"; replace it with the headless
# build declared above (same cv2 module) instead of installing both.
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with File(...)/Query(...) defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]
